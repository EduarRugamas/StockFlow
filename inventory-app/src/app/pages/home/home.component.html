<div class="min-h-screen w-full bg-slate-50 p-6">

  <!-- Contenedor principal -->
  <div class="mx-auto w-full max-w-7xl">

    <!-- Bloque del título -->
    <div
      class="rounded-xl border border-slate-200 bg-white px-6 py-8 text-center shadow-sm"
    >
      <div
        class="mx-auto flex h-14 w-14 items-center justify-center rounded-full bg-blue-100 text-blue-600"
      >
        <i class="pi pi-chart-bar text-2xl"></i>
      </div>

      <h1 class="mt-4 text-3xl font-bold text-slate-800 md:text-4xl">
        Panel de inventario
      </h1>

      <p class="mt-2 text-base text-slate-500">
        Selecciona una opción para continuar
      </p>
    </div>

    <!-- Bloque del contenido -->
    <div class="mt-8 rounded-xl border border-slate-200 bg-white p-6 shadow-sm">

      <div class="mb-6">
        <h2 class="text-xl font-semibold text-slate-800">
          Resumen general
        </h2>

        <p class="mt-1 text-sm text-slate-500">
          Consulta la información principal del inventario.
        </p>
      </div>

      <!-- Grid de cards -->
      <div class="grid grid-cols-1 gap-6 md:grid-cols-2 lg:grid-cols-3">

        <app-card
          title="Productos"
          footerText="Ver productos"
          value="100"
          icon="pi pi-box"
           (footerClick)="navigationToUrl('products')"
        />

        <app-card
          title="Movimientos"
          footerText="Ver movimientos"
          value="50"
          icon="pi pi-arrow-right-arrow-left"
           (footerClick)="navigationToUrl('movements')"
        />

        <app-card
          title="Alertas"
          footerText="Ver alertas"
          value="10"
          icon="pi pi-exclamation-triangle"
          (footerClick)="navigationToUrl('alerts')"
        />

      </div>

    </div>

  </div>

</div>
